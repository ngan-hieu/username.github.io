<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sbkidi - Bio Link</title>
    <!-- FontAwesome hỗ trợ icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bio-container">
        
        <!-- Phần tiêu đề và câu Bio -->
        <h1 class="title">Sbkidi</h1>
        <p class="subtitle">
            Hãy học cách chấp nhận, vì mọi thứ rồi sẽ khác, chỉ là sớm hay muộn mà thôi
        </p>

        <div class="social-grid">
            
            <!-- Discord -->
            <a href="https://discord.gg/nFyaN95xN" target="_blank" class="card">
                <div class="icon-box discord">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <span>Discord(Link Sever)</span>
            </a>

            <!-- Facebook -->
            <a href="https://facebook.com/your-profile" target="_blank" class="card">
                <div class="icon-box facebook">
                    <i class="fa-brands fa-facebook"></i>
                </div>
                <span>Facebook</span>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@your-channel" target="_blank" class="card">
                <div class="icon-box youtube">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <span>YouTube</span>
            </a>

        </div>

    </div>

</body>
</html>
